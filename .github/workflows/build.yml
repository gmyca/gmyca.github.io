name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 给 workflow 写入 Pages 和 OIDC 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署在跑
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 动态计算 Vite base 路径
      #   username.github.io 仓库 → base 为 /
      #   其他仓库             → base 为 /仓库名/
      - name: Set Vite base path
        run: |
          REPO="${{ github.event.repository.name }}"
          if echo "$REPO" | grep -qE '\.github\.io$'; then
            echo "VITE_BASE=/" >> $GITHUB_ENV
          else
            echo "VITE_BASE=/${REPO}/" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
